name: CI
on: [push, pull_request]
jobs:
  rust-and-dolt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: scripts/install-dolt.sh
      - run: scripts/install-beads.sh
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - uses: actions/checkout@v4
        with:
          repository: mooselabs/scrolls
          ref: 3ae0a38dcc4da0a508e82ce4737d226e06d6f2b4
          path: .verification/scrolls-0.3.0
      - uses: actions/checkout@v4
        with:
          repository: mooselabs/scrolls
          ref: a4bf897811abbb19657a824b5eb3470a2733ce16
          path: .verification/scrolls-shared-previous
      # Includes real local/shared Dolt HTTP, security, recovery and shutdown tests.
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release --all-targets
      - run: python3 scripts/demo.py --binary target/release/scrolls --out /tmp/scrolls-demo
      - run: python3 scripts/verify-beads.py --binary target/release/scrolls
      - uses: actions/checkout@v4
        with:
          repository: python/peps
          ref: 6068058b896441388bbf22f2607ab681193f6a3d
          path: .verification/peps
      - run: python3 scripts/verify-imports.py .verification/peps --binary target/release/scrolls --out /tmp/scrolls-import-qualification
      - uses: actions/upload-artifact@v4
        with:
          name: scrolls-linux-amd64
          path: |
            target/release/scrolls
            scripts/install-dolt.sh
            README.md
