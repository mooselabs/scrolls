[package]
name = "scrolls"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Local, versioned knowledge graphs backed by Dolt"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "sync", "time", "macros"] }
percent-encoding = "2"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
globset = "0.4"
hex = "0.4"
libc = "0.2"
mysql = { version = "26.0.1", default-features = false, features = ["minimal-rust"] }
regex = "1"
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
unsafe-libyaml = "0.2"
sha2 = "0.10"
shell-words = "1"
tar = "0.4"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
